[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vending-machine-iot-lab"
version = "0.1.0"
description = "Isolated vending machine security and administration simulator"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
mqtt = ["paho-mqtt>=2.1,<3"]

[tool.setuptools.packages.find]
include = ["app*", "scenarios*"]
